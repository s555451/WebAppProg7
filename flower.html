<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Obora Stephen Efurhievwe finds avians</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .grid-cell {
            width: 70px;
            height: 70px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 2px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        .bush { background-color: #2e8b57; } 
        .ivy { background-color: #8b0000; }  
        .rose { background-color: #ff1493; } 
        .lily { background-color: #ff8c00; } 
        .daisy { background-color: #1e90ff; }
    </style>
</head>
<body class="container py-4">
    <h1>Obora Stephen Efurhievwe finds avians</h1>
    <p>Click on the locations to find the flowers, watch out for the poison ivy</p>
    <p id="locations">Number of locations checked is zero.</p>
    <p id="score">Score is zero.</p>
    <p onclick="help()" style="cursor: pointer; color: blue; text-decoration: underline;">Click for help.</p>
    <p id="help">Help report</p>

    <div id="game-field"></div>

    <script>
        let ids = [];
        for (let i = 0; i < 36; i++) ids.push("img" + i);

        let score = 0;
        let locationsVisited = 0;
        let lastLocation = 0;
        
        // Bonus / Standard randomized locations
        let poisonLocation = Math.floor(Math.random() * 36);
        let roseLocation = Math.floor(Math.random() * 36);
        let lilyLocations = [Math.floor(Math.random() * 36), Math.floor(Math.random() * 36)];
        let daisyLocations = [
            Math.floor(Math.random() * 36), 
            Math.floor(Math.random() * 36), 
            Math.floor(Math.random() * 36), 
            Math.floor(Math.random() * 36), 
            Math.floor(Math.random() * 36)
        ];
        let gameOver = false;

        let container = document.getElementById("game-field");
        for (let r = 0; r < 6; r++) {
            let rowDiv = document.createElement("div");
            rowDiv.className = "d-flex";
            for (let c = 0; c < 6; c++) {
                let index = r * 6 + c;
                let cell = document.createElement("div");
                cell.id = ids[index];
                cell.className = "grid-cell bush";
                cell.innerHTML = "Bush";
                cell.onclick = function() { check(index); };
                rowDiv.appendChild(cell);
            }
            container.appendChild(rowDiv);
        }

        function check(position) {
            if (gameOver) return;
            let cellElem = document.getElementById(ids[position]);
            
            if (position === poisonLocation) {
                cellElem.className = "grid-cell ivy";
                cellElem.innerHTML = "Ivy";
                gameOver = true;
                score -= 4;
            } else if (position === roseLocation) {
                cellElem.className = "grid-cell rose";
                cellElem.innerHTML = "Rose";
                score += 4;
            } else if (lilyLocations.includes(position)) {
                cellElem.className = "grid-cell lily";
                cellElem.innerHTML = "Lily";
                score += 2;
            } else if (daisyLocations.includes(position)) {
                cellElem.className = "grid-cell daisy";
                cellElem.innerHTML = "Daisy";
                score += 1;
            } else {
                cellElem.className = "grid-cell daisy";
                cellElem.innerHTML = "Daisy";
                score += 1;
            }

            locationsVisited++;
            lastLocation = position;

            // Move rose randomly on click (Bonus requirement)
            let dirs = [-1, 1, -6, 6];
            let randomDir = dirs[Math.floor(Math.random() * dirs.length)];
            let newRose = roseLocation + randomDir;
            if (newRose >= 0 && newRose < 36) {
                roseLocation = newRose;
            }
            if (roseLocation === position) {
                gameOver = true;
                document.getElementById("help").innerHTML = "Game over! Rose landed on player.";
            }

            document.getElementById("locations").innerHTML = "Number of locations checked is " + locationsVisited;
            document.getElementById("score").innerHTML = "Score is " + score;
        }

        function help() {
            let neighbors1 = [lastLocation - 1, lastLocation + 1, lastLocation - 6, lastLocation + 6];
            for (let n of neighbors1) {
                if (daisyLocations.includes((n + 36) % 36)) {
                    document.getElementById("help").innerHTML = "cold";
                    return;
                }
            }
            
            let row = Math.floor(lastLocation / 6);
            let col = lastLocation % 6;
            let foundRose = false;
            let foundIvy = false;

            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                        let idx = r * 6 + c;
                        if (idx === roseLocation) foundRose = true;
                        if (idx === poisonLocation) foundIvy = true;
                    }
                }
            }

            if (foundRose) {
                document.getElementById("help").innerHTML = "hot";
            } else if (foundIvy) {
                document.getElementById("help").innerHTML = "watch out";
            } else {
                document.getElementById("help").innerHTML = "warm";
            }
        }
    </script>
</body>
</html>
