<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Obora Stephen Efurhievwe builds list with divs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            background-color: DodgerBlue;
            gap: 10px;
            padding: 10px;
            flex-wrap: wrap;
        }
        .divlist {
            background-color: #f1f1f1;
            padding: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body class="container py-4">
    <h1>Obora Stephen Efurhievwe builds list with divs</h1>

    <input type="text" id="userInput" class="form-control mb-3" placeholder="Enter text here">
    <button class="btn btn-success me-2" onclick="addEnd()">Add end</button>
    <button class="btn btn-primary me-2" onclick="addFront()">Add front</button>
    <button class="btn btn-warning me-2" onclick="removeEveryOther()">Remove</button>
    <button class="btn btn-info" onclick="shuffleDivs()">Shuffle</button>

    <div class="flex-container mt-3" id="container">
        <div class="divlist">First item</div>
        <div class="divlist">Second item</div>
        <div class="divlist">Third item</div>
    </div>

    <script>
        function addEnd() {
            let val = document.getElementById("userInput").value;
            let newDiv = document.createElement("div");
            newDiv.innerHTML = val ? val : "New Item";
            newDiv.className = "divlist";
            document.getElementById("container").appendChild(newDiv);
        }

        function addFront() {
            let val = document.getElementById("userInput").value;
            let newDiv = document.createElement("div");
            newDiv.innerHTML = val ? val : "New Item";
            newDiv.className = "divlist";
            let container = document.getElementById("container");
            container.insertBefore(newDiv, container.firstChild);
        }

        function removeEveryOther() {
            let divListItems = document.getElementsByClassName("divlist");
            let itemsArray = Array.from(divListItems);
            for (let i = 0; i < itemsArray.length; i += 2) {
                itemsArray[i].remove();
            }
        }

        function shuffleDivs() {
            let container = document.getElementById("container");
            let items = Array.from(container.getElementsByClassName("divlist"));
            if (items.length < 2) return;
            let idx1 = Math.floor(Math.random() * items.length);
            let idx2 = Math.floor(Math.random() * items.length);
            if (idx1 === idx2) return;
            
            let clone1 = items[idx1].cloneNode(true);
            let clone2 = items[idx2].cloneNode(true);
            
            items[idx1].replaceWith(clone2);
            items[idx2].replaceWith(clone1);
        }
    </script>
</body>
</html>
