<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Obora Stephen Efurhievwe builds list with divs</title>
    <style>
        .flex-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .divlist { background: #e0e0e0; padding: 15px; border: 1px solid #ccc; }
    </style>
</head>
<body class="container py-4">
    <h1>Obora Stephen Efurhievwe builds list with divs</h1>
    <input type="text" id="userInput" class="form-control mb-2" placeholder="Enter text">
    <button onclick="addEnd()" class="btn btn-primary">Add end</button>
    <button onclick="addFront()" class="btn btn-success">Add front</button>
    <button onclick="removeEveryOther()" class="btn btn-warning">Remove</button>

    <div class="flex-container" id="container">
        <div class="divlist">First item</div>
        <div class="divlist">Second item</div>
        <div class="divlist">Third item</div>
    </div>

    <script>
        function addEnd() {
            let val = document.getElementById("userInput").value;
            let newDiv = document.createElement("div");
            newDiv.innerHTML = val ? val : "New Item";
            newDiv.className = "divlist";
            document.getElementById("container").appendChild(newDiv);
        }

        function addFront() {
            let val = document.getElementById("userInput").value;
            let newDiv = document.createElement("div");
            newDiv.innerHTML = val ? val : "Front Item";
            newDiv.className = "divlist";
            let container = document.getElementById("container");
            container.insertBefore(newDiv, container.firstChild);
        }

        function removeEveryOther() {
            let divListItems = document.getElementsByClassName("divlist");
            // Remove from back to front to avoid index shifting issues
            for (let i = divListItems.length - 1; i >= 0; i -= 2) {
                divListItems[i].remove();
            }
        }
    </script>
</body>
</html>
